spring.application.name=ebank-bot
server.port=8058
eureka.client.enabled=true
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true

# Configuration Spring AI OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:demo_key}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Configuration MCP Client vers les microservices
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.connections.customer-service.url=http://localhost:8056/mcp/message
spring.ai.mcp.client.connections.ebank-service.url=http://localhost:8057/mcp/message

# Configuration Telegram Bot
telegram.bot.username=${TELEGRAM_BOT_USERNAME:EbankFalagBot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
